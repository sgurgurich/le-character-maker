name: Release

# Push a tag like v1.2.3 (matching package.json's version) to publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match package.json version $version" }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $out = & ./dist/LE-Character-Maker.exe cli classes
          if ($LASTEXITCODE -ne 0 -or -not ($out -match 'Rogue')) { throw "exe smoke test failed: $out" }
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist/LE-Character-Maker.exe `
            dist/LE-Character-Maker.exe.sha256 `
            --title "LE Character Maker ${{ github.ref_name }}" `
            --generate-notes
